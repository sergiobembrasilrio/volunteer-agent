# Volunteer-Ops — Portais de Busca
# ─────────────────────────────────────────────────────────────────
# CONFIGURAÇÃO DO UTILIZADOR
# Define quais regiões incluir no scan.
# true  = vasculhar nesta sessão
# false = ignorar (economiza tokens)
#
# Uso:
#   scan             → usa esta config (só regiões marcadas true)
#   scan eu          → força scan só Europa Schengen
#   scan balkans     → força scan só Balcãs / Europa Leste
#   scan asia        → força scan só Sudeste Asiático
#   scan japan       → força scan só Japão
#   scan all         → ignora config, varre tudo
# ─────────────────────────────────────────────────────────────────

active_regions:
  europe_schengen: true        # Itália, Espanha, Portugal, França, Grécia, Alemanha, etc.
  europe_east_balkans: false   # Bulgária, Sérvia, Bósnia, Montenegro, Albânia, Macedónia, Kosovo
  europe_caucasus: false       # Geórgia, Arménia, Azerbaijão
  europe_other: false          # Reino Unido, Irlanda, Noruega, Islândia
  asia_southeast: false        # Tailândia, Indonésia, Vietnã, Camboja, Filipinas, Malásia
  asia_east: false             # Japão, Coreia do Sul, Taiwan
  asia_south: false            # India, Nepal, Sri Lanka
  americas_central: false      # Costa Rica, Guatemala, México, Panamá
  americas_south: false        # Brasil, Argentina, Chile, Peru, Colômbia
  americas_north: false        # EUA, Canadá
  africa_north: false          # Marrocos, Tunísia, Egipto
  africa_sub_saharan: false    # Quénia, Tanzânia, África do Sul, Uganda
  oceania: false               # Austrália, Nova Zelândia, Fiji
  middle_east: false           # Turquia, Jordânia, Israel

# ─────────────────────────────────────────────────────────────────
# PORTAIS — por região
# ─────────────────────────────────────────────────────────────────

portais:

  # ── EUROPA SCHENGEN ──────────────────────────────────────────
  europe_schengen:

    - portal: Volunteers Base
