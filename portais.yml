# ─────────────────────────────────────────────────────────────────
# PORTAIS GLOBAIS — vasculhar em qualquer scan (independente da região)
# ─────────────────────────────────────────────────────────────────
global_always:

  - portal: Free Volunteering (global)
    url: "https://freevolunteering.net"
    nota: "Lista global, gratuito — algumas oportunidades podem redirecionar para pagos"

  - portal: Permaculture Global
    url: "https://www.permacultureglobal.org/projects"
    nota: "Mapa global de projetos — muitos aceitam voluntários"

  - portal: IC.org (Foundation for Intentional Community)
    url: "https://www.ic.org/directory/"
    nota: "Diretório de comunidades intencionais — ecovilas, cooperativas"

  - portal: Permaculture Research Institute (PRI) Network
    url: "https://permacultureresearchinstitute.org/volunteer/"
    nota: "Rede global de sítios certificados PRI — permacultura, agrofloresta, muitos aceitam voluntários"

  - portal: Eurotopia (Europa — comunidades intencionais)
    url: "https://eurotopia.de/en/"
    nota: "Diretório Europeu de ecovilas e comunidades — bom para Schengen + Balcãs"

  - portal: Diggers & Dreamers (UK + Europa)
    url: "https://www.diggersanddreamers.org.uk"
    nota: "Comunidades intencionais UK e Europa — housing coop, ecovilas, farms"

  - portal: Trustroots
    url: "https://www.trustroots.org"
    nota: "Alternativa ao CouchSurfing, nonprofit, forte em viajantes e voluntários nômades — rede de confiança útil para referências"

  - portal: BeWelcome
    url: "https://www.bewelcome.org"
    nota: "Alternativa open source ao CouchSurfing — menor mas activo, boas referências de anfitrião"

# ─────────────────────────────────────────────────────────────────
# ONGs / PROJETOS SOCIAIS — diretórios e redes de ONGs com voluntários
# ─────────────────────────────────────────────────────────────────
ongs_and_ngos:

  global:
    - portal: Idealist
      url: "https://www.idealist.org/en/volunteer"
      nota: "200k+ ONGs globais, gratuito — filtrar por localização e tipo"

    - portal: ReliefWeb (Humanitarian)
      url: "https://reliefweb.int/jobs?experience=0&type=Volunteer"
      nota: "ONGs humanitárias globais — ACNUR, Oxfam, MSF, etc."

    - portal: Grassroots Volunteering (NGO directory)
      url: "https://grassrootsvolunteering.org/volunteer_opportunities/"
      nota: "Curado à mão, zero organizações pagas para listar — alta credibilidade"

    - portal: UN Volunteers (UNV)
      url: "https://www.unv.org/partner/become-un-volunteer"
      nota: "Programa ONU — estruturado, requer experiência, mas referência global"

    - portal: NICE Japan (NPO)
      url: "https://nice1.gr.jp/en/"
      nota: "PRIORIDADE JAPÃO — rede japonesa de voluntariado internacional, gratuita, sem fins lucrativos"

    - portal: SCI (Service Civil International)
      url: "https://www.sci.ngo/volunteer/"
      nota: "Rede histórica de voluntariado (desde 1920), workcamps Europa e Ásia"

    - portal: WWOOF Independents
      url: "https://www.wwoofindependents.org"
      nota: "Fazendas WWOOF NÃO oficiais — gratuito, contato directo com fazendeiros"

  europe:
    - portal: European Solidarity Corps
      url: "https://youth.europa.eu/solidarity_en"
      nota: "Programa EU financiado — viagem + alojamento + bolsa. Requer 18-30 anos (verificar elegibilidade)."

    - portal: ECAS (European Citizen Action Service)
      url: "https://www.ecas.org/volunteering-in-europe/"
      nota: "Recursos de voluntariado na Europa, links para programas EU"

    - portal: GoAbroad (Europe)
      url: "https://www.goabroad.com/volunteer-abroad/search/europe/volunteer-abroad-1"
      nota: "Diretório de programas — alguns gratuitos, outros pagos — filtrar"

  japan:
    - portal: NICE Japan Workcamps
      url: "https://nice1.gr.jp/en/programs/"
      nota: "PRIORIDADE MÁXIMA — workcamps no Japão, gratuitos, experiência cultural profunda"

    - portal: JEN Japan (NPO)
      url: "https://jen-npo.net/en/"
      nota: "ONG japonesa — projetos comunitários"

    - portal: Peace Boat
      url: "https://peaceboat.org/english/volunteer"
      nota: "Voluntariado a bordo de navio — experiência única, mas diferente do foco"

  southeast_asia:
    - portal: GoAbroad (Southeast Asia)
      url: "https://www.goabroad.com/volunteer-abroad/search/southeast-asia/volunteer-abroad-1"
      nota: "Diretório — filtrar por custo: free/low-cost"

    - portal: Grassroots Volunteering (SEA)
      url: "https://grassrootsvolunteering.org/volunteer-location/southeast-asia/"
      nota: "Curado, projetos éticos no SEA"

  balkans_eastern_europe:
    - portal: SCI Workcamps Europe
      url: "https://www.sci.ngo/workcamp/search/?country=Bulgaria,Serbia,Bosnia"
      nota: "Workcamps de curta duração (2-3 semanas) nos Balcãs — gratuitos com acomodação"

    - portal: Alliance of Voluntary Service Organisations
      url: "https://www.alliance-network.eu/workcamp-database/"
      nota: "Base de dados de workcamps na Europa, inclui Balcãs"

# ─────────────────────────────────────────────────────────────────
# PLATAFORMAS PAGAS (não scrapear — acesso manual)
# ─────────────────────────────────────────────────────────────────
