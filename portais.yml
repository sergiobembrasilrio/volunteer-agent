        - { country: "Espanha",  url: "https://www.volunteersbase.com/europe/spain" }
        - { country: "Portugal", url: "https://www.volunteersbase.com/europe/portugal",    nota: "PT nativo — fit cultural máximo" }
        - { country: "França",   url: "https://www.volunteersbase.com/europe/france" }
        - { country: "Grécia",   url: "https://www.volunteersbase.com/europe/greece" }
        - { country: "Croácia",  url: "https://www.volunteersbase.com/europe/croatia" }
        - { country: "Alemanha", url: "https://www.volunteersbase.com/europe/germany" }
