      urls:
        - { region: "Europa",    url: "https://www.hopperjobs.com/search?region=europe" }

    - portal: HelpX
      nota: "$20 por 2 anos — permite enviar mensagens activas. Vale para Europa."
      urls:
        - { region: "Europa",    url: "https://www.helpx.net/list.asp?continent=Europe" }

    - portal: Free Volunteering
      nota: "100% gratuito — curado, foco em hostels e fazendas"
